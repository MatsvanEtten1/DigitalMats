# Introtekst

1. Waarom fotografie voor mij bijzonder is. <br>

2. Creatief zijn op een avontuurlijke manier. <br>

3. Mijn foto's en de verhalen er achter. <br>

Dit wil ik vooral laten zien met mijn eigen fotos en reizen die ik gemaakt heb. Daarnaast kan ik vertellen welke andere fotografen inspiratie voor mij zijn en waar ik veel van heb geleerd. <br>

Fotografie laat mij op een andere manier naar de wereld kijken. Met mijn camera leg ik tijdens verschillende rijzen momenten en herinneringen vast.
