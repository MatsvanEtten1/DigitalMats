    <header>
      <h1>Digital garden van Mats van Etten</h1>

      <form>
        <label for="auto-mode">
          <input type="radio" id="auto-mode" name="color-theme" value="auto" />
          Auto
        </label>

        <label for="light-mode">
          <input
            type="radio"
            id="light-mode"
            name="color-theme"
            value="light"
            checked
          />
          Light
        </label>

        <label for="dark-mode">
          <input type="radio" id="dark-mode" name="color-theme" value="dark" />
          Dark
        </label>
      </form>
    </header>
